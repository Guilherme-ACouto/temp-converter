name: Pipeline completo com IA

on:
  workflow_dispatch:
    inputs:
      cenario:
        description: "Cenário de teste do deploy"
        type: choice
        options: [normal, com_falha]
        default: normal

permissions:
  contents: read
  issues: write

jobs:
  qualidade:   # o quality gate que já existe nas aulas anteriores
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Rodar testes e gerar relatorio de cobertura
        run: mvn -B test jacoco:report

      - name: Calcular percentual de cobertura de linhas
        run: |
          COVERAGE=$(awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "%.1f", (100*c/(c+m))}' target/site/jacoco/jacoco.csv)
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          echo "Cobertura calculada: ${COVERAGE}%"
          cat target/site/jacoco/jacoco.csv

      - name: IA decide se o pipeline avanca
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
          MODELO: openai/gpt-oss-20b
          TAREFA: >-
            Voce e um quality gate de pipeline CI/CD de um conversor de temperatura em Java/Spring Boot.
            Minimo exigido de cobertura de testes: 80%. Nunca aprove se a cobertura for menor que 80%.
          ARQUIVO_DADOS: cobertura.txt
          OPCOES: APROVADO BLOQUEADO
          OPCAO_SEGURA: BLOQUEADO
        run: |
          echo "Cobertura de testes de linhas: ${COVERAGE}%" > cobertura.txt
          bash scripts/ia_decisao.sh
          cp ia_decisao.txt decisao.txt

      - name: Falhar se a IA bloqueou
        run: |
          if [ "$(cat decisao.txt)" = "BLOQUEADO" ]; then
            echo "::error::Quality Gate bloqueou o avanco do pipeline (cobertura ${{ env.COVERAGE }}%)"
            exit 1
          fi

  seguranca:              # SAST fixo + code review pela IA (trechos I e J)
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Trecho I: SAST com regras fixas
      - name: SAST simples (regras fixas)
        run: |
          PERIGOSOS='Runtime\.getRuntime\(\)\.exec\(|ProcessBuilder\(|\.exec\("\/bin'
          SEGREDOS='(api_?key|senha|password|secret|token)[[:space:]]*[:=][[:space:]]*[^"]{8,}'
          if grep -rnE "$PERIGOSOS" src/main/java \
            || grep -rniE "$SEGREDOS" src/main/java; then
            echo "::error::SAST: padrão perigoso ou segredo no código"
            exit 1
          fi
          echo "SAST: nenhum padrão perigoso encontrado"

      # Trecho J: revisão de segurança pela IA
      - name: Separar o código para revisão
        run: |
          git diff HEAD~1 -- '*.java' > codigo_revisao.txt
          [ -s codigo_revisao.txt ] || cat src/main/java/com/example/tempconverter/*.java > codigo_revisao.txt

      - name: Code review de seguranca pela IA
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
          MODELO: openai/gpt-oss-20b
          TAREFA: >-
            Code review de segurança de um conversor de temperatura Celsius/Fahrenheit em Spring Boot.
            Reprove se houver execução de comandos, injeção de SQL, segredos no código ou erro de lógica grave.
          ARQUIVO_DADOS: codigo_revisao.txt
          OPCOES: APROVAR REPROVAR
          OPCAO_SEGURA: REPROVAR
        run: |
          bash scripts/ia_decisao.sh
          if [ "$(cat ia_decisao.txt)" != "APROVAR" ]; then
            echo "::error::Revisão de segurança reprovou"
            exit 1
          fi

  aprovacao:   # humano no loop
    needs: [qualidade, seguranca]
    runs-on: ubuntu-latest
    environment: producao   # o run PARA aqui até alguém aprovar
    steps:
      - run: echo "Deploy aprovado por ${{ github.actor }}"

  deploy:      # deploy + canary + rollback (Tarefas 1 e 2)
    needs: aprovacao
    runs-on: ubuntu-latest
    env:
      LIMITE_ERRO_PCT: 5
      LIMITE_P99_MS: 800
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17 e Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Montar a versão estável em outra pasta
        run: git worktree add ../versao-estavel HEAD~1

      - name: Compilar versão nova
        run: mvn -B -q -DskipTests package

      - name: Compilar versão estável
        working-directory: ../versao-estavel
        run: mvn -B -q -DskipTests package

      - name: Subir versão estável (porta 8001)
        working-directory: ../versao-estavel
        run: |
          JAR=$(find target -maxdepth 1 -name "*.jar" ! -name "*.original" | head -n1)
          setsid nohup java -jar "$JAR" --server.port=8001 > "$GITHUB_WORKSPACE/estavel.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/estavel.pid"

      - name: Subir versão nova (porta 8002)
        run: |
          JAR=$(find target -maxdepth 1 -name "*.jar" ! -name "*.original" | head -n1)
          setsid nohup java -jar "$JAR" --server.port=8002 > nova.log 2>&1 &
          echo $! > nova.pid

      - name: Esperar as duas versões responderem
        run: |
          for PORTA in 8001 8002; do
            for _ in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$PORTA/" > /dev/null && break
              sleep 1
            done
            curl -sf "http://127.0.0.1:$PORTA/" > /dev/null \
              || { echo "::error::Porta $PORTA não respondeu"; cat ./*.log; exit 1; }
          done

      - name: Simular falha na versão nova
        if: inputs.cenario == 'com_falha'
        run: kill -- "-$(cat nova.pid)" || true

      - name: Canary release
        id: canary
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
          MODELO: openai/gpt-oss-20b
          IA_RESUMO: "0"
        run: |
          echo "[]" > historico.json
          {
            echo "## 🐤 Canary"
            echo "| Etapa | Erro | p99 | Ação | Análise da IA |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for PCT in 10 50 100; do
            bash scripts/medir.sh "http://127.0.0.1:8001/" "http://127.0.0.1:8002/" "$PCT" 200 etapa.json
            jq -s '.[0] + [.[1]]' historico.json etapa.json > h.tmp
            mv h.tmp historico.json
            ERRO=$(jq '.nova.taxa_erro_pct' etapa.json)
            P99=$(jq '.nova.latencia_p99_ms' etapa.json)
            RUIM=$(jq --argjson e "$LIMITE_ERRO_PCT" --argjson l "$LIMITE_P99_MS" \
              '.nova.taxa_erro_pct > $e or .nova.latencia_p99_ms > $l' etapa.json)
            if [ "$RUIM" = "true" ]; then
              echo "| $PCT% | $ERRO% | $P99 ms | 🛑 rollback imediato | não consultada |" >> "$GITHUB_STEP_SUMMARY"
              { echo "rollback=true"; echo "motivo=Limite fixo estourado com $PCT% do tráfego"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            JUST="—"
            if [ "$PCT" -lt 100 ]; then
              TAREFA="Canary release. Os dados são o histórico das etapas (pct_nova = % do tráfego na versão nova).
                Limites: erro <= ${LIMITE_ERRO_PCT}% e p99 <= ${LIMITE_P99_MS}ms.
                Se o erro ou a latência estiverem subindo de forma consistente e perto do limite, escolha ROLLBACK
                mesmo sem estourar. Variações pequenas e longe do limite são ruído: nesse caso escolha CONTINUAR."
              ARQUIVO_DADOS=historico.json OPCOES="CONTINUAR ROLLBACK" OPCAO_SEGURA=ROLLBACK \
                TAREFA="$TAREFA" bash scripts/ia_decisao.sh
              JUST=$(cat ia_justificativa.txt)
              if [ "$(cat ia_decisao.txt)" != "CONTINUAR" ]; then
                echo "| $PCT% | $ERRO% | $P99 ms | ⚠️ rollback preditivo | $JUST |" >> "$GITHUB_STEP_SUMMARY"
                { echo "rollback=true"; echo "motivo=IA previu degradação com $PCT% do tráfego"; } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "| $PCT% | $ERRO% | $P99 ms | ✅ avança | $JUST |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "rollback=false" >> "$GITHUB_OUTPUT"

      - name: Executar rollback
        if: steps.canary.outputs.rollback == 'true'
        env:
          MOTIVO: ${{ steps.canary.outputs.motivo }}
        run: |
          bash scripts/medir.sh "http://127.0.0.1:8001/" "http://127.0.0.1:8002/" 0 100 pos_rollback.json
          ERRO=$(jq '.estavel.taxa_erro_pct' pos_rollback.json)
          { echo "### ↩️ Rollback executado"; echo "- Motivo: $MOTIVO"; echo "- Versão estável após o rollback: erro de ${ERRO}%"; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Rollback: $MOTIVO"
          exit 1

      - name: Abrir issue do incidente
        if: failure() && steps.canary.outputs.rollback == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOTIVO: ${{ steps.canary.outputs.motivo }}
        run: |
          gh issue create --title "Rollback automático do deploy (pipeline completo)" \
            --body "Motivo: $MOTIVO. Detalhes: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
