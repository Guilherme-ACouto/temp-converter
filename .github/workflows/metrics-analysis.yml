name: IA analisando metricas
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  analisar-metricas:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Login GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: IA analisa metricas
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
        run: |
          PAYLOAD=$(jq -n --rawfile metrics metrics/system.json '{
            model: "openai/gpt-oss-20b",
            messages: [
              {role: "system", content: "Voce e especialista em observabilidade e analise de metricas de um servico Java em producao. Se cpu, memoria, latencia ou taxa de erro estiverem em niveis perigosos, responda comecando com RISCO. Caso contrario, comece com OK."},
              {role: "user", content: ("Analise estas metricas e diga se existe risco operacional:\n\n" + $metrics)}
            ]
          }')
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQCLOUD_API_KEY" \
            -d "$PAYLOAD")
          echo "Resposta bruta da IA:"
          echo "$RESPONSE"
          DECISION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [ -z "$DECISION" ]; then
            echo "::error::A API da Groq nao retornou uma resposta valida."
            {
              echo "## Erro na chamada a API da Groq"
              echo '```json'
              echo "$RESPONSE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Decisao da IA:"
          echo "$DECISION"
          echo "$DECISION" > decisao.txt
          {
            echo "## Analise de metricas pela IA"
            echo '```json'
            cat metrics/system.json
            echo '```'
            echo '```'
            cat decisao.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$DECISION" | grep -qiE "crítico|critico|risco|grave|instável|instavel"; then
            gh issue create --title "Risco detectado nas metricas" --body-file decisao.txt
            exit 1
          fi
