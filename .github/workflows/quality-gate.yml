name: Quality Gate com IA
on:
  workflow_dispatch:
    inputs:
      cenario:
        description: "Cenario de teste"
        type: choice
        options: [normal, cobertura_baixa]
        default: normal

permissions:
  issues: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Simular cobertura baixa (cenario de teste)
        if: inputs.cenario == 'cobertura_baixa'
        run: sed -i 's/@Test/@org.junit.jupiter.api.Disabled @Test/' src/test/java/com/example/tempconverter/TemperatureServiceTest.java

      - name: Rodar testes e gerar relatorio de cobertura
        run: mvn -B test jacoco:report

      - name: Calcular percentual de cobertura de linhas
        run: |
          COVERAGE=$(awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "%.1f", (100*c/(c+m))}' target/site/jacoco/jacoco.csv)
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          echo "Cobertura calculada: ${COVERAGE}%"

      - name: IA decide se o pipeline avanca
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
        run: |
          PAYLOAD=$(jq -n --arg coverage "$COVERAGE" '{
            model: "llama-3.1-8b-instant",
            messages: [
              {role: "system", content: "Voce e um quality gate de pipeline CI/CD de um conversor de temperatura em Java/Spring Boot. Nunca aprove se a cobertura de testes for menor que 80%. Responda comecando exatamente com APROVADO ou BLOQUEADO, seguido de uma breve justificativa."},
              {role: "user", content: ("Cobertura de testes de linhas: " + $coverage + "%. Minimo exigido: 80%. O codigo pode avancar no pipeline?")}
            ]
          }')
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQCLOUD_API_KEY" \
            -d "$PAYLOAD")
          echo "Resposta bruta da IA:"
          echo "$RESPONSE"
          DECISION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [ -z "$DECISION" ]; then
            echo "::error::A API da Groq nao retornou uma resposta valida."
            {
              echo "## Erro na chamada a API da Groq"
              echo '```json'
              echo "$RESPONSE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Decisao da IA:"
          echo "$DECISION"
          echo "$DECISION" > decisao.txt
          {
            echo "## Quality Gate com IA"
            echo "- Cobertura calculada: ${COVERAGE}%"
            echo "- Cenario: ${{ inputs.cenario }}"
            echo ""
            echo "### Decisao da IA"
            echo '```'
            cat decisao.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$DECISION" | grep -qi "BLOQUEADO"; then
            echo "BLOQUEADO=true" >> "$GITHUB_ENV"
          fi

      - name: Login GitHub CLI
        if: env.BLOQUEADO == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Abrir issue e falhar o pipeline se bloqueado
        if: env.BLOQUEADO == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Quality Gate bloqueou o pipeline (cenario: ${{ inputs.cenario }})" --body-file decisao.txt
          echo "::error::Quality Gate bloqueou o avanco do pipeline"
          exit 1
