name: IA analisando logs
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  analisar-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Login GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: IA analisa logs
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
        run: |
          PAYLOAD=$(jq -n --rawfile logs logs/app.log '{
            model: "llama-3.1-8b-instant",
            messages: [
              {role: "system", content: "Voce e um especialista em observabilidade e analise de logs de um conversor de temperatura Java. Se houver qualquer linha CRITICAL ou ERROR grave, responda comecando com CRITICO. Caso contrario, comece com OK."},
              {role: "user", content: ("Analise estes logs:\n\n" + $logs)}
            ]
          }')
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQCLOUD_API_KEY" \
            -d "$PAYLOAD")
          echo "Resposta bruta da IA:"
          echo "$RESPONSE"
          DECISION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [ -z "$DECISION" ]; then
            echo "::error::A API da Groq nao retornou uma resposta valida. Veja a resposta bruta acima."
            exit 1
          fi
          echo "Decisao da IA:"
          echo "$DECISION"
          echo "$DECISION" > decisao.txt
          {
            echo "## Analise de logs pela IA"
            echo '```'
            cat decisao.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$DECISION" | grep -qiE "crítico|critico"; then
            gh issue create --title "Erro critico detectado nos logs" --body-file decisao.txt
            exit 1
          fi
