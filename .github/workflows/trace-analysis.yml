name: IA analisando traces
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  analisar-traces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: IA analisa traces
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
        run: |
          PAYLOAD=$(jq -n --rawfile trace traces/conversion_trace.txt '{
            model: "llama-3.1-8b-instant",
            messages: [
              {role: "system", content: "Voce e especialista em distributed tracing. Se houver timeout ou gargalo relevante, responda comecando com GARGALO. Caso contrario, comece com OK."},
              {role: "user", content: ("Analise este trace e identifique gargalos:\n\n" + $trace)}
            ]
          }')
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQCLOUD_API_KEY" \
            -d "$PAYLOAD")
          echo "Resposta bruta da IA:"
          echo "$RESPONSE"
          DECISION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [ -z "$DECISION" ]; then
            echo "::error::A API da Groq nao retornou uma resposta valida."
            {
              echo "## Erro na chamada a API da Groq"
              echo '```json'
              echo "$RESPONSE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Decisao da IA:"
          echo "$DECISION"
          echo "$DECISION" > decisao.txt
          {
            echo "## Analise de trace pela IA"
            echo '```'
            cat decisao.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$DECISION" | grep -qiE "timeout|gargalo|crítico|critico"; then
            gh issue create --title "Gargalo detectado em trace distribuido" --body-file decisao.txt
            exit 1
          fi
