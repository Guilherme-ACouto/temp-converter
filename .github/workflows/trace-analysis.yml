name: IA analisando traces
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  analisar-traces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: IA analisa traces
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
        run: |
          TRACE=$(cat traces/conversion_trace.txt | tr '\n' ' ')
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQCLOUD_API_KEY" \
            -d '{
              "model": "llama-3.1-8b-instant",
              "messages": [
                {
                  "role": "system",
                  "content": "Voce e especialista em distributed tracing."
                },
                {
                  "role": "user",
                  "content": "Analise este trace e identifique gargalos: '"$TRACE"'"
                }
              ]
            }')
          echo "$RESPONSE"
          DECISION=$(echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['choices'][0]['message']['content'])")
          echo "$DECISION"
          {
            echo "## Analise de trace pela IA"
            echo '```'
            echo "$DECISION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$DECISION" > decisao.txt
          if echo "$DECISION" | grep -qiE "timeout|gargalo|crítico|critico"; then
            gh issue create --title "Gargalo detectado em trace distribuido" --body-file decisao.txt
            exit 1
          fi
